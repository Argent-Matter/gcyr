[versions]
# GregTech
gtceu = "7.5.1"
ldlib = "1.0.40.b"
registrate = "MC1.20-1.3.11"
# Configuration
configuration = "3.1.0-forge"

# Mixin Extras
mixinExtras = "0.5.0-rc.3"

# Recipe viewers
emi = "1.1.24+1.20.1"
jei = "15.57.0.208"

# Curios
curios = "5.14.1+1.20.1"

# KJS
kubejs = "2001.6.5-build.26"
rhino = "2001.2.3-build.10"
architectury = "9.2.14"

# WAILA-likes
jade = "11.13.3+forge" # modrinth maven

# Radium
radium = "0.12.4+git.26c9d8e"

[libraries]
# GregTech
gtceu               = { module = "com.gregtechceu.gtceu:gtceu-1.20.1", version.ref = "gtceu" }
ldlib               = { module = "com.lowdragmc.ldlib:ldlib-forge-1.20.1", version.ref = "ldlib" }
registrate          = { module = "com.tterrag.registrate:Registrate", version.ref = "registrate" }

# Configuration
configuration       = { module = "dev.toma.configuration:configuration-1.20.1", version.ref = "configuration" }

# Mixin Extras

mixinExtras-common  = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinExtras" }
mixinExtras-forge   = { module = "io.github.llamalad7:mixinextras-forge", version.ref = "mixinExtras" }

# Recipe viewers
emi                 = { module = "dev.emi:emi-forge", version.ref = "emi" }
jei-api-common      = { module = "mezz.jei:jei-1.20.1-common-api", version.ref = "jei" }
jei-api-forge       = { module = "mezz.jei:jei-1.20.1-forge-api", version.ref = "jei" }
jei-impl            = { module = "mezz.jei:jei-1.20.1-forge", version.ref = "jei" }

# WAILA-likes
jade                = { module = "maven.modrinth:jade", version.ref = "jade" }

# KJS
kubejs              = { module = "dev.latvian.mods:kubejs-forge", version.ref = "kubejs" }
rhino               = { module = "dev.latvian.mods:rhino", version.ref = "rhino" }
architectury        = { module = "dev.architectury:architectury-forge", version.ref = "architectury" }

# Curios
curios              = { module = "top.theillusivec4.curios:curios-forge", version.ref = "curios" }

# Radium
radium              = { module = "me.jellysquid.mods:radium", version.ref = "radium" }


[bundles]
jei-api = ["jei-api-common", "jei-api-forge"]
kjs     = ["kubejs", "rhino", "architectury"]