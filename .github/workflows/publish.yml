name: Publish Version

on:
  workflow_call:
    inputs:
      simulate:
        required: false
        type: boolean
      tag-name:
        description: 'Tag to build from and upload to'
        required: true
        type: string
      release-body:
        description: 'Body for published release notes'
        required: false
        type: string
      changelog-body:
        description: 'Body of change notes to insert into CHANGELOG.md'
        required: false
        type: string

jobs:
  build:
    name: Build and Publish to Maven
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: 'true'
    outputs:
      mc-version: ${{ steps.versions.outputs.mc-version }}
      mod-version: ${{ steps.versions.outputs.mod-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag-name }}
      - name: Setup Build
        uses: ./.github/actions/build_setup
        with:
          ref: ${{ inputs.tag-name }}

      - name: Get Version
        id: versions
        run: |
          echo "$(./gradlew -q printVersions)" >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew assemble

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ inputs.tag-name }}
          path: build/libs/*
          if-no-files-found: error
          retention-days: 3

      - name: Publish to Maven
        if: ${{ !inputs.simulate }}
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew publish

  upload-release-artifacts:
    name: Upload Artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ inputs.tag-name }}
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag-name }}
          files: ./*.jar
          fail_on_unmatched_files: true

  publish-modrinth:
    name: Publish to Modrinth
    needs: build
    if: ${{ !inputs.simulate }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ inputs.tag-name }}
      - name: Publish Mod
        env:
          LOADER: ${{ needs.build.outputs.mc-version == '1.21.1' && 'neoforge' || 'forge' }}
          JAVA: ${{ needs.build.outputs.mc-version == '1.21.1' && '21' || '17' }}
          VERSION_TYPE: 'beta'
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: 7tG215v7
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            ./gcyr-${{ needs.build.outputs.mc-version }}-${{ needs.build.outputs.mod-version }}.jar
            ./!(gcyr-${{ needs.build.outputs.mc-version }}-${{ needs.build.outputs.mod-version }}.jar)
          name: 'GCYR ${{ needs.build.outputs.mod-version }} for ${{ needs.build.outputs.mc-version }}'
          version: '${{ needs.build.outputs.mod-version }}'
          version-type: ${{ env.VERSION_TYPE }}
          changelog: ${{ inputs.release-body }}
          loaders: ${{ env.LOADER }}
          java: ${{ env.JAVA }}
          fail-mode: fail

  publish-cf:
    name: Publish to CF
    needs: build
    if: ${{ !inputs.simulate }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ inputs.tag-name }}
      - name: Publish Mod
        env:
          LOADER: ${{ needs.build.outputs.mc-version == '1.21.1' && 'neoforge' || 'forge' }}
          JAVA: ${{ needs.build.outputs.mc-version == '1.21.1' && '21' || '17' }}
          VERSION_TYPE: 'beta'
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          curseforge-id: 890405
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            ./gtceu-${{ needs.build.outputs.mc-version }}-${{ needs.build.outputs.mod-version }}.jar
            ./!(gtceu-${{ needs.build.outputs.mc-version }}-${{ needs.build.outputs.mod-version }}.jar)
          name: 'GCYR ${{ needs.build.outputs.mod-version }} for ${{ needs.build.outputs.mc-version }}'
          version: '${{ needs.build.outputs.mod-version }}'
          version-type: ${{ env.VERSION_TYPE }}
          changelog: ${{ inputs.release-body }}
          loaders: ${{ env.LOADER }}
          java: ${{ env.JAVA }}
          fail-mode: fail

  # After successful release, PR version bump and changelog
  bump-version-and-changelog:
    name: Bump Version and Build Changelog
    needs: [ build, upload-release-artifacts ]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.mc-version }}
      - name: Bump Version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C gh/release-${{ needs.build.outputs.mc-version }}
          BUMPED=$(echo ${{ needs.build.outputs.mod-version }} | awk -F. '/[0-9]+\./{$NF++;print}' OFS=.)
          sed -i "s/= ${{ needs.build.outputs.mod-version }}/= ${BUMPED}/" gradle.properties
          git commit -am "Bump version to ${BUMPED}"
      - name: Prepend to CHANGELOG
        if: inputs.changelog-body
        run: |
          { head -n 2 CHANGELOG.md; echo -e "${{ inputs.changelog-body }}"; tail -n +3 CHANGELOG.md; } > temp.md && mv temp.md CHANGELOG.md
          git commit -am "Updated CHANGELOG"
      - name: Push and PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force --set-upstream origin gh/release-${{ needs.build.outputs.mc-version }}
          gh pr create -B ${{ needs.build.outputs.mc-version }} -H gh/release-${{ needs.build.outputs.mc-version }} --title "RELEASE for ${{ needs.build.outputs.mc-version }} [no-snapshot]" --body "Created by GH Workflow" --label "ignore changelog"
