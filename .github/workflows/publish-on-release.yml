name: Publish on Release

on:
  release:
    types: [released]

jobs:
  meta:
    name: Metadata
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Get Config
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: '.github/json'

      - name: Get Version
        id: version
        run: echo "$(./gradlew -q printVersions)" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: './.github/json/config-${{ steps.version.outputs.mc-version }}.json'
          ignorePreReleases: true
          fetchViaCommits: true
          failOnError: true

  publish:
    needs: [ meta ]
    if: ${{ contains(github.ref_name, '1.20.1') || contains(github.ref_name, '1.21.1') }}
    secrets: inherit
    uses: ./.github/workflows/publish.yml
    with:
      simulate: ${{ startsWith(github.event.release.name, 'simulate') || github.repository_owner != 'Argent-Matter' }}
      tag-name: ${{ github.ref_name }}
      release-body: ${{ github.event.release.body }}
      changelog-body: ${{ needs.meta.outputs.changelog }}
